[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trade-bot"
version = "0.1.0"
description = "Congressional copy-trading dashboard: who is buying what, and whether following them works"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Adham Karim" }]
dependencies = [
  # Chrome TLS impersonation. The Senate's disclosure portal sits behind an
  # edge WAF that fingerprints the TLS handshake, so it rejects httpx and
  # curl with a 403 no matter how faithful their headers are, from any IP.
  "curl-cffi>=0.7,<1",
  # XML parsing for filing indexes and RSS, hardened against entity attacks.
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  # Keys are optional, but when present they belong in the system keychain.
  "keyring>=25.6,<26",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pandas-market-calendars>=4.6,<5",
  # Parquet engine for the price cache.
  "pyarrow>=19,<24",
  # Reads the transaction tables out of House PTR filings.
  "pypdf>=5,<7",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  # FastAPI form handling for the dashboard's POST actions.
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
# Optional: the pooled trade-edge model that refines member ranking. The
# statistical ranking works without any of this, and nothing else needs a
# model, so scikit-learn and joblib live here rather than in the base install.
ml = [
  "joblib>=1.4,<2",
  "lightgbm>=4.6,<5",
  "scikit-learn>=1.6,<2",
]
# Optional: reading the scanned paper filings that have no text layer. Only
# these few hundred filings need it; everything else parses locally for free.
vision = [
  "openai>=1.60,<3",
  "pillow>=11,<12",
]
# Optional: Supabase/Postgres instead of local SQLite.
postgres = [
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "hypothesis>=6.127,<7",
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
trade-bot = "trade_bot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_bot"]

[tool.hatch.build]
include = [
  "src/trade_bot/**/*.py",
  "src/trade_bot/py.typed",
  "src/trade_bot/templates/**",
  "src/trade_bot/static/**",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings -m 'not optional_ml'"
testpaths = ["tests"]
markers = ["optional_ml: requires the expanded local ML dependency set"]

[tool.coverage.run]
branch = true
source = ["trade_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trade_bot"]
exclude = ["migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "defusedxml.*",
  "keyring.*",
  "sklearn.*",
  "joblib.*",
  "pandas_market_calendars.*",
  "lightgbm.*",
  "pypdf.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Installed only with the `vision` extra; the module degrades to a no-op when
# they are missing, so type checking must not require them to be present.
module = ["PIL.*", "openai.*"]
ignore_missing_imports = true
