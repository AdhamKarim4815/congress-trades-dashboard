# Blueprint for the interactive dashboard.
#
# Example blueprint for hosting the interactive dashboard on Render's free web
# service. The trade-off of a free instance is that it sleeps after roughly
# fifteen minutes idle and takes about fifty seconds to wake, so the first
# visit after a quiet spell is slow. Any host that runs a Docker image works
# the same way.
#
# This is the copy with working buttons. A static snapshot from
# `trade-bot export` is the read-only alternative.

services:
  - type: web
    name: copytrade
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # The one required secret: a postgresql+psycopg:// URL for a database you
      # run. Set it in the Render dashboard, never in this file.
      - key: TRADE_BOT_DATABASE_URL
        sync: false
      # Optional. Without it the scan-reading stage is skipped and everything
      # else behaves normally.
      - key: OPENAI_API_KEY
        sync: false
      # A free instance has 512 MB. A full refresh parses filing PDFs and
      # builds price frames, which is the one thing here that can exhaust
      # that, so the on-demand refresh is deliberately gentler than CI's:
      # fewer parallel downloads, fewer filings per run. A scheduled job on a
      # larger runner can still do the heavy pass.
      - key: TRADE_BOT_DISCLOSURES__MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: TRADE_BOT_DISCLOSURES__MAX_FILINGS_PER_SYNC
        value: "60"
      # Keeps login sessions valid across a restart, which a sleeping free
      # instance does often. Generated by Render, not stored here.
      - key: TRADE_BOT_SESSION_SECRET
        generateValue: true
